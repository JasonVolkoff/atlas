# Canonical Python style for this repo. Flake8 and isort read this file automatically.
# Pre-commit runs isort, ruff format, and flake8 on backend/ (see .pre-commit-config.yaml).
# Ruff formatter line length must stay in sync: pyproject.toml [tool.ruff] line-length

[flake8]
max-line-length = 99
extend-ignore =
    # Black / Ruff-compatible style
    E203,
    # Line length: enforced by max-line-length (E501) when over limit
exclude =
    .git,
    __pycache__,
    */migrations/*,
    .eggs,
    *.egg,
    .venv,
    venv,
    build,
    dist,
    frontend,
    node_modules,
    .nuxt,
    .output,

[isort]
profile = black
line_length = 99
src_paths = backend
skip_glob = */migrations/*
known_first_party =
    atlas,
    geography,
    housing,
    data_pipeline
